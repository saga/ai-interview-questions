              - generic [ref=f4e1012]:
                - paragraph [ref=f4e1013]: A financial services company is building a customer-service AI assistant using Amazon Bedrock. The AI assistant must not provide investment advice to users. It must block harmful content, mask personally identifiable information (PII), and retain audit trails for compliance reporting. The AI assistant must apply content filtering to both user inputs and model responses according to content sensitivity.
                - paragraph [ref=f4e1014]: The company needs an Amazon Bedrock guardrail configuration that effectively enforces these policies with minimal false positives. The solution must support multiple handling strategies for multiple sensitive-content types.
                - paragraph [ref=f4e1015]: Which solution meets these requirements?
                - generic [ref=f4e1016]:
                  - list [ref=f4e1017]:
                    - listitem [ref=f4e1018] [cursor=pointer]:
                      - strong [ref=f4e1019]: A
                      - text: Configure a single guardrail and set content filters to high for all categories. Set up denied topics for investment advice and include sample phrases to block. Set up sensitive information filters that apply the block action for all PII entities. Apply the guardrail to all model inference calls.
                    - listitem [ref=f4e1020] [cursor=pointer]:
                      - strong [ref=f4e1021]: B
                      - text: Configure multiple guardrails by using tiered policies. Create one guardrail and set content filters to high. Configure the guardrail to block PII for public interactions. Configure a second guardrail and set content filters to medium. Configure the second guardrail to mask PII for internal use. Configure multiple topic-specific guardrails to block investment advice and set up contextual grounding checks.
                    - listitem [ref=f4e1022] [cursor=pointer]:
                      - strong [ref=f4e1023]: C
                      - text: Configure a guardrail and set content filters to medium for harmful content. Set up denied topics for investment advice and include clear definitions and sample phrases to block. Configure sensitive information filters to mask PII in responses and to block financial information in inputs. Enable both input and output evaluations that use custom blocked messages for audits.
                    - listitem [ref=f4e1024] [cursor=pointer]:
                      - strong [ref=f4e1025]: D
                      - text: Create a separate guardrail for each use case. Create one guardrail that applies a harmful content filter. Create a guardrail to apply topic filters for investment advice. Create a guardrail to apply sensitive information filters to block PII. Use AWS Step Functions to chain the guardrails together sequentially. Use conditional logic based on content classification.
                  - button "Show Answer" [ref=f4e1026] [cursor=pointer]
                  - generic [ref=f4e1033]:
                    - group "Explanation" [ref=f4e1034]:
                      - paragraph [ref=f4e1036]: "Amazon Bedrock Guardrails can combine medium-strength harmful-content filters, denied topics with definitions and example phrases, and sensitive-information filters in one configuration. Sensitive-information policies can apply different actions to inputs and outputs: PII can be anonymized in responses, while financial information can be blocked in inputs. Guardrails evaluate both prompts and model responses, and medium filtering helps limit false positives relative to high-strength filtering."
