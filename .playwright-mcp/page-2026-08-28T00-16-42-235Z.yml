                  - text: A company has deployed an AI assistant as a React application that uses AWS Amplify, an AWS AppSync GraphQL API, and Amazon Bedrock Knowledge Bases. The application uses the GraphQL API to invoke the Amazon Bedrock RetrieveAndGenerate API for knowledge base interactions. The company configures an AWS Lambda resolver with the
                  - code [ref=f4e1535]: RequestResponse
                  - text: invocation type.
                - paragraph [ref=f4e1536]: Application users report frequent timeouts and slow response times. Users report these issues more often for complex questions that require longer processing.
                - paragraph [ref=f4e1537]: The company needs a solution to resolve these performance issues and improve the user experience.
                - paragraph [ref=f4e1538]: Which solution will meet these requirements?
                - generic [ref=f4e1539]:
                  - list [ref=f4e1540]:
