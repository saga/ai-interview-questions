              - generic [ref=f4e1276]:
                - paragraph [ref=f4e1277]: Example Corp operates a personalized video-generation service used by millions of enterprise customers. Customers create marketing videos by submitting prompts to the company’s proprietary generative AI (GenAI) model. To improve output relevance and personalization, Example Corp wants to enrich prompts with customer-specific context, including product preferences, customer attributes, and business history.
                - paragraph [ref=f4e1278]: The customers have strict data-governance requirements. They must retain full ownership and control of their data. They do not need real-time access; however, semantic accuracy must be high and retrieval latency must stay low to support customer-experience use cases.
                - paragraph [ref=f4e1279]: Example Corp wants to minimize architectural complexity in its integration pattern. It does not want to deploy and manage services in each customer’s environment unless necessary.
                - paragraph [ref=f4e1280]: Which solution meets these requirements?
                - generic [ref=f4e1281]:
                  - list [ref=f4e1282]:
                    - listitem [ref=f4e1283] [cursor=pointer]:
                      - strong [ref=f4e1284]: A
                      - text: Ensure that each customer sets up an Amazon Q Business index that includes the customer's internal data. Ensure that each customer designates Example Corp as a data accessor to allow Example Corp to retrieve relevant content by using a secure API to enrich prompts at runtime.
                    - listitem [ref=f4e1285] [cursor=pointer]:
                      - strong [ref=f4e1286]: B
                      - text: Use federated search with Model Context Protocol (MCP) by deploying real-time MCP servers for each customer. Retrieve data in real time during prompt generation.
                    - listitem [ref=f4e1287] [cursor=pointer]:
                      - strong [ref=f4e1288]: C
                      - text: Ensure that each customer configures an Amazon Bedrock knowledge base. Allow cross-account querying so Example Corp can retrieve structured data for prompt augmentation.
                    - listitem [ref=f4e1289] [cursor=pointer]:
                      - strong [ref=f4e1290]: D
                      - text: Configure Amazon Kendra to crawl customer data sources. Share the resulting indexes across accounts so Example Corp can query each customer's Amazon Kendra index to retrieve augmentation data.
                  - button "Show Answer" [ref=f4e1291] [cursor=pointer]
                  - generic [ref=f4e1298]:
                    - group "Explanation" [ref=f4e1299]:
                      - paragraph [ref=f4e1301]:
