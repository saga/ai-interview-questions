                - paragraph [ref=f4e674]: A company is building a new AI-powered application that must integrate with several specialized tools. The tools currently operate as Model Context Protocol (MCP) servers on developers’ local machines and retain no state between invocations. The company intends to deploy each MCP server as an AWS Lambda function to support the production application.
