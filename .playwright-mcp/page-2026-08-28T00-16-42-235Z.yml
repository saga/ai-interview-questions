              - generic [ref=f4e1875]:
                - paragraph [ref=f4e1876]: A company is building a generative AI (GenAI) application that analyzes customer service calls in real time and produces suggested responses for human customer service agents. The application must handle 500,000 concurrent calls during peak hours, with less than 200 ms end-to-end latency for every suggestion. The company uses an existing architecture to transcribe customer-call audio streams. The application must stay within a predefined monthly compute budget and retain auto-scaling capabilities.
                - paragraph [ref=f4e1877]: Which solution meets these requirements?
                - generic [ref=f4e1878]:
                  - list [ref=f4e1879]:
                    - listitem [ref=f4e1880] [cursor=pointer]:
                      - strong [ref=f4e1881]: A
                      - text: Deploy a large, complex reasoning model on Amazon Bedrock. Purchase provisioned throughput and optimize for batch processing.
                    - listitem [ref=f4e1882] [cursor=pointer]:
                      - strong [ref=f4e1883]: B
                      - text: Deploy a low-latency, real-time optimized model on Amazon Bedrock. Purchase provisioned throughput and set up automatic scaling policies.
                    - listitem [ref=f4e1884] [cursor=pointer]:
                      - strong [ref=f4e1885]: C
                      - text: Deploy a large language model (LLM) on an Amazon SageMaker AI real-time endpoint that uses dedicated GPU instances.
                    - listitem [ref=f4e1886] [cursor=pointer]:
                      - strong [ref=f4e1887]: D
                      - text: Deploy a mid-sized language model on an Amazon SageMaker AI serverless endpoint that is optimized for batch processing.
