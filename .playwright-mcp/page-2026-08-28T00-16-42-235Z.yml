              - generic [ref=f4e1620]:
                - paragraph [ref=f4e1621]: A financial services company uses multiple foundation models (FMs) through Amazon Bedrock for its generative AI (GenAI) applications. To meet a new regulation governing GenAI use with sensitive financial data, the company requires a token-management solution.
                - paragraph [ref=f4e1622]: The token-management solution must proactively alert when applications near model-specific token limits. It must also handle more than 5,000 requests per minute and retain token-usage metrics to allocate costs among business units.
                - paragraph [ref=f4e1623]: Which solution will satisfy these requirements?
                - generic [ref=f4e1624]:
                  - list [ref=f4e1625]:
                    - listitem [ref=f4e1626] [cursor=pointer]:
                      - strong [ref=f4e1627]: A
                      - text: Develop model-specific tokenizers in an AWS Lambda function. Configure the Lambda function to estimate token usage before sending requests to Amazon Bedrock. Configure the Lambda function to publish metrics to Amazon CloudWatch and trigger alarms when requests approach thresholds. Store detailed token usage in Amazon DynamoDB to report costs.
                    - listitem [ref=f4e1628] [cursor=pointer]:
                      - strong [ref=f4e1629]: B
                      - text: Implement Amazon Bedrock Guardrails with token quota policies. Capture metrics on rejected requests. Configure Amazon EventBridge rules to trigger notifications based on Amazon Bedrock Guardrails metrics. Use Amazon CloudWatch dashboards to visualize token usage trends across models.
                    - listitem [ref=f4e1630] [cursor=pointer]:
                      - strong [ref=f4e1631]: C
                      - text: Deploy an Amazon SQS dead-letter queue for failed requests. Configure an AWS Lambda function to analyze token-related failures. Use Amazon CloudWatch Logs Insights to generate reports on token usage patterns based on error logs from Amazon Bedrock API responses.
                    - listitem [ref=f4e1632] [cursor=pointer]:
                      - strong [ref=f4e1633]: D
                      - text: Use Amazon API Gateway to create a proxy for all Amazon Bedrock API calls. Configure request throttling based on custom usage plans with predefined token quotas. Configure API Gateway to reject requests that will exceed token limits.
                  - button "Show Answer" [ref=f4e1634] [cursor=pointer]
                  - generic [ref=f4e1641]:
                    - group "Explanation" [ref=f4e1642]:
                      - paragraph [ref=f4e1644]: Amazon Bedrock enforces token quotas per model, so token usage must be estimated with the applicable model’s tokenization rules before inference to identify approaching limits. A scalable Lambda layer can perform that pre-request estimation, emit model- and business-unit-specific custom CloudWatch metrics for threshold alarms, and store detailed usage records in DynamoDB for chargeback reporting. Amazon Bedrock Guardrails do not implement token quota policies, dead-letter queues operate after failed requests, and API Gateway usage plans apply request quotas rather than model-specific token calculations.
                    - group "Learn more" [ref=f4e1645]:
                      - list [ref=f4e1647]:
