            - generic [ref=f4e158]:
              - generic [ref=f4e159]:
                - paragraph [ref=f4e160]: A university has recently digitized a collection of archival documents, academic journals, and manuscripts. The university keeps the digital files in an AWS Lake Formation data lake.
                - paragraph [ref=f4e161]: The university employs a GenAI developer to build a solution that lets users search the digital files with text queries. The solution must return journal abstracts that are semantically similar to a user's query. Users must be able to search the digitized collection using text and metadata associated with the journal abstracts. The digitized-file metadata contains no keywords. The solution must match similar abstracts to each other based on the similarity of their text. The data lake contains fewer than 1 million files.
                - paragraph [ref=f4e162]:
                  - text: Which solution will satisfy these requirements with the
                  - strong [ref=f4e163]: LEAST
                  - text: operational overhead?
                - generic [ref=f4e164]:
                  - list [ref=f4e165]:
                    - listitem [ref=f4e166] [cursor=pointer]:
                      - strong [ref=f4e167]: A
                      - text: Use Amazon Titan Embeddings in Amazon Bedrock to create vector representations of the digitized files. Store embeddings in the OpenSearch Neural Plugin for Amazon OpenSearch Service.
                    - listitem [ref=f4e168] [cursor=pointer]:
                      - strong [ref=f4e169]: B
                      - text: Use Amazon Comprehend to extract topics from the digitized files. Store the topics and file metadata in an Amazon Aurora PostgreSQL database. Query the abstract metadata against the data in the Aurora database.
                    - listitem [ref=f4e170] [cursor=pointer]:
                      - strong [ref=f4e171]: C
                      - text: Use Amazon SageMaker AI to deploy a sentence-transformer model. Use the model to create vector representations of the digitized files. Store embeddings in an Amazon Aurora PostgreSQL database that has the pgvector extension.
                    - listitem [ref=f4e172] [cursor=pointer]:
                      - strong [ref=f4e173]: D
                      - text: Use Amazon Titan Embeddings in Amazon Bedrock to create vector representations of the digitized files. Store embeddings in an Amazon Aurora PostgreSQL Serverless database that has the pgvector extension.
                  - button "Show Answer" [ref=f4e174] [cursor=pointer]
                  - generic [ref=f4e181]:
                    - group "Explanation" [ref=f4e182]:
                      - paragraph [ref=f4e184]: Amazon Titan Embeddings produces vector representations that capture the semantic meaning of abstract text. Aurora PostgreSQL Serverless with the pgvector extension can store those embeddings, perform vector similarity searches, and retain associated metadata for filtering. Using Bedrock and Aurora Serverless avoids operating a custom SageMaker model endpoint and reduces database capacity-management overhead; pgvector is supported for vector search in Aurora PostgreSQL.
                    - group "Learn more" [ref=f4e185]:
                      - list [ref=f4e187]:
                        - listitem [ref=f4e188]:
                          - link "Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock" [ref=f4e189] [cursor=pointer]:
