                - paragraph [ref=f4e588]: A financial services company plans to use Amazon Bedrock foundation models (FMs) to analyze call center recordings. After calls end, the call center stores the recordings as MP3 files in an Amazon S3 bucket. The company must generate summaries and sentiment analysis for the recordings in a structured format as soon as new files are created. The recordings are 20 MB on average.
