            - generic [ref=f4e1957]:
              - generic [ref=f4e1958]:
                - paragraph [ref=f4e1959]: A finance company is building an AI assistant to help clients plan investments and manage their portfolios. The company identifies several high-risk conversation patterns, such as requests for specific stock recommendations or guaranteed returns. These high-risk conversation patterns could result in regulatory violations if the company cannot apply appropriate controls.
                - paragraph [ref=f4e1960]: The company must ensure that the AI assistant does not provide unsuitable financial advice, produce content about competitors, or make claims that are not factually supported by the company's approved financial guidance. The company wants to use Amazon Bedrock Guardrails to implement a solution.
                - paragraph [ref=f4e1961]: Which combination of steps will satisfy these requirements?
                - generic [ref=f4e1962]:
                  - generic [ref=f4e1963]: Choose three
                  - list [ref=f4e1964]:
                    - listitem [ref=f4e1965] [cursor=pointer]:
                      - strong [ref=f4e1966]: A
                      - text: Add the high-risk conversation patterns to a denied topics guardrail.
                    - listitem [ref=f4e1967] [cursor=pointer]:
                      - strong [ref=f4e1968]: B
                      - text: Configure a content filter guardrail to filter prompts that contain the high-risk conversation patterns.
                    - listitem [ref=f4e1969] [cursor=pointer]:
                      - strong [ref=f4e1970]: C
                      - text: Configure a content filter guardrail to filter prompts that contain competitor names.
                    - listitem [ref=f4e1971] [cursor=pointer]:
                      - strong [ref=f4e1972]: D
                      - text: Add the names of competitors as custom word filters. Set the input and output actions to block.
                    - listitem [ref=f4e1973] [cursor=pointer]:
                      - strong [ref=f4e1974]: E
                      - text: Set a low grounding score threshold.
                    - listitem [ref=f4e1975] [cursor=pointer]:
                      - strong [ref=f4e1976]: F
                      - text: Set a high grounding score threshold.
                  - button "Show Answer" [ref=f4e1977] [cursor=pointer]
                  - generic [ref=f4e1984]:
                    - group "Explanation" [ref=f4e1985]:
                      - paragraph [ref=f4e1987]: Amazon Bedrock denied topics block undesirable contextual subjects in prompts and model responses, making them suitable for high-risk financial-advice patterns. Custom word filters block exact words or phrases, including competitor names, and can block both input and output. Contextual grounding checks assess whether a response is factually grounded in supplied approved source material; a high threshold requires a stronger confidence score before content is allowed.
