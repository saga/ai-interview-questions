                - paragraph [ref=f4e928]: A company is building a generative AI (GenAI)-powered customer support application that uses Amazon Bedrock foundation models (FMs). The application must retain conversational context across multiple interactions with the same user. It must run clarification workflows to address ambiguous user queries. The company must retain encrypted records of every user conversation for personalization. The application must support thousands of concurrent users while responding quickly to each user.
