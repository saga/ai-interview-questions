              - generic [ref=f4e1704]:
                - paragraph [ref=f4e1705]: A company operates a Retrieval Augmented Generation (RAG) application that uses Amazon Bedrock Knowledge Bases for regulatory compliance queries. The application uses the RetrieveAndGenerateStream API. It retrieves relevant documents from a knowledge base containing more than 50,000 regulatory documents, legal precedents, and policy updates.
                - paragraph [ref=f4e1706]: The RAG application is generating suboptimal responses because initial retrieval frequently returns documents that are semantically similar but contextually irrelevant. These poor responses are leading to model hallucinations and incorrect regulatory guidance. The company must improve RAG application performance so that it returns more relevant documents.
                - paragraph [ref=f4e1707]:
                  - text: Which solution meets this requirement with the
                  - strong [ref=f4e1708]: LEAST
                  - text: operational overhead?
                - generic [ref=f4e1709]:
                  - list [ref=f4e1710]:
                    - listitem [ref=f4e1711] [cursor=pointer]:
                      - strong [ref=f4e1712]: A
                      - text: Deploy an Amazon SageMaker endpoint to run a fine-tuned ranking model. Use an Amazon API Gateway REST API to route requests. Configure the application to make requests through the REST API to rerank the results.
                    - listitem [ref=f4e1713] [cursor=pointer]:
                      - strong [ref=f4e1714]: B
                      - text: Use Amazon Comprehend to classify documents and apply relevance scores. Integrate the RAG application’s reranking process with Amazon Textract to run document analysis. Use Amazon Neptune to perform graph-based relevance calculations.
                    - listitem [ref=f4e1715] [cursor=pointer]:
                      - strong [ref=f4e1716]: C
                      - text: Implement a retrieval pipeline that uses the Amazon Bedrock Knowledge Bases Retrieve API to perform initial document retrieval. Call the Amazon Bedrock Rerank API to rerank the results. Invoke the InvokeModelWithResponseStream operation to generate responses.
                    - listitem [ref=f4e1717] [cursor=pointer]:
                      - strong [ref=f4e1718]: D
                      - text: Use the latest Amazon reranker model through the reranking configuration within Amazon Bedrock Knowledge Bases. Use the model to improve document relevance scoring and to reorder results based on contextual assessments.
                  - button "Show Answer" [ref=f4e1719] [cursor=pointer]
                  - generic [ref=f4e1726]:
                    - group "Explanation" [ref=f4e1727]:
                      - paragraph [ref=f4e1729]: Amazon Bedrock Knowledge Bases can apply a managed reranker through the retrieval reranking configuration when using RetrieveAndGenerate or RetrieveAndGenerateStream. The reranker evaluates the relevance of retrieved text chunks to the query and reorders them, replacing the default Knowledge Bases ranking. This improves contextual relevance while avoiding the operational burden of deploying and integrating separate ranking, API, document-analysis, or graph-processing services.
                    - group "Learn more" [ref=f4e1730]:
