              - generic [ref=f4e2219]:
                - paragraph [ref=f4e2220]: A financial services company is developing a Retrieval Augmented Generation (RAG) application that uses Amazon Bedrock to produce summaries of market activities. The application depends on a vector database that stores a small proprietary dataset with a low index count. The application must run similarity searches, and the Amazon Bedrock model responses must maximize accuracy while maintaining high performance.
                - paragraph [ref=f4e2221]: The company needs to configure the vector database and integrate it with the application.
                - paragraph [ref=f4e2222]: Which solution meets these requirements?
                - generic [ref=f4e2223]:
                  - list [ref=f4e2224]:
                    - listitem [ref=f4e2225] [cursor=pointer]:
                      - strong [ref=f4e2226]: A
                      - text: Launch an Amazon MemoryDB cluster and configure the index by using the Flat algorithm. Configure a horizontal scaling policy based on performance metrics.
                    - listitem [ref=f4e2227] [cursor=pointer]:
                      - strong [ref=f4e2228]: B
                      - text: Launch an Amazon MemoryDB cluster and configure the index by using the Hierarchical Navigable Small World (HNSW) algorithm. Configure a vertical policy based on performance metrics.
                    - listitem [ref=f4e2229] [cursor=pointer]:
                      - strong [ref=f4e2230]: C
                      - text: Launch an Amazon Aurora PostgresSQL cluster and configure the index by using the Inverted File with Flat Compression (IVFFlat) algorithm. Configure the instance class to scale to a larger size when the load increases.
                    - listitem [ref=f4e2231] [cursor=pointer]:
                      - strong [ref=f4e2232]: D
                      - text: Launch an Amazon DocumentDB cluster that has an Inverted File with Flat Compression (IVFFlat) index and a high probe value. Configure connections to the cluster as a replica set Distribute reads to replica instances.
                  - button "Show Answer" [ref=f4e2233] [cursor=pointer]
                  - generic [ref=f4e2240]:
                    - group "Explanation" [ref=f4e2241]:
                      - paragraph [ref=f4e2243]: MemoryDB's FLAT vector index performs a brute-force linear comparison of every vector and returns exact nearest-neighbor results within distance-calculation precision. For a small index, this preserves maximum retrieval accuracy without the large-index latency disadvantage of exhaustive search. HNSW and IVFFlat are approximate indexing methods that can improve speed by accepting possible recall loss.
                    - group "Learn more" [ref=f4e2244]:
                      - list [ref=f4e2246]:
