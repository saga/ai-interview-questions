            - generic [ref=f4e498]:
              - generic [ref=f4e499]:
                - paragraph [ref=f4e500]: A company is developing a serverless application that uses AWS Lambda functions to help students worldwide summarize notes. The application uses Anthropic Claude through Amazon Bedrock. The company has noticed that most traffic occurs during evening hours in each time zone. Users report throttling errors at peak usage times in their respective time zones.
                - paragraph [ref=f4e501]: The company must resolve the throttling issues while ensuring the application operates continuously. The solution must preserve application performance quality and must not incur a fixed hourly cost during periods of low traffic.
                - paragraph [ref=f4e502]: Which solution meets these requirements?
                - generic [ref=f4e503]:
                  - list [ref=f4e504]:
                    - listitem [ref=f4e505] [cursor=pointer]:
                      - strong [ref=f4e506]: A
                      - text: Create custom Amazon CloudWatch metrics to monitor model errors. Set provisioned throughput to a value that is safely higher than the peak traffic observed.
