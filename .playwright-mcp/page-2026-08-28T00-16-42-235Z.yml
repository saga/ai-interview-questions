                - generic [ref=f4e1179]:
                  - paragraph [ref=f4e1180]: A medical device company wants to provide an AI assistant with reports of medical procedures that used the company’s devices. To safeguard patient privacy, the AI assistant must reveal patient personally identifiable information (PII) only to surgeons. For engineers, the AI assistant must redact PII. The AI assistant must reference only medical reports that are less than 3 years old.
                  - paragraph [ref=f4e1181]: The company stores reports in an Amazon S3 bucket immediately after each report is published. The company has already configured an Amazon Bedrock knowledge base. The AI assistant uses Amazon Cognito for user authentication.
                  - paragraph [ref=f4e1182]: Which solution meets these requirements?
                  - generic [ref=f4e1183]:
                    - list [ref=f4e1184]:
                      - listitem [ref=f4e1185] [cursor=pointer]:
                        - strong [ref=f4e1186]: A
                        - text: Enable Amazon Macie PII detection on the S3 bucket. Use an S3 trigger to invoke an AWS Lambda function that redacts PII from the reports. Configure the Lambda function to delete outdated documents from the bucket and to invoke knowledge base syncing.
                      - listitem [ref=f4e1187] [cursor=pointer]:
                        - strong [ref=f4e1188]: B
                        - text: Invoke an AWS Lambda function to sync the S3 bucket and the knowledge base when a new report is uploaded to the bucket. Use a second Lambda function to invoke Amazon Comprehend to detect and redact PII if a user is part of the engineer Cognito user group. Set up an S3 Lifecycle configuration to remove reports that are older than 3 years from the bucket.
                      - listitem [ref=f4e1189] [cursor=pointer]:
                        - strong [ref=f4e1190]: C
                        - text: Set up an S3 Lifecycle configuration on the bucket to remove reports that are older than 3 years. Schedule an AWS Lambda function to run daily syncs between the bucket and the knowledge base. When users interact with the AI assistant, call the ApplyGuardrail configuration that matches the user's Cognito user group to redact PII from the agent’s responses if appropriate.
                      - listitem [ref=f4e1191] [cursor=pointer]:
                        - strong [ref=f4e1192]: D
                        - text: Create a second knowledge base. Set up an S3 Lifecycle configuration on the bucket to remove reports that are older than 3 years. Invoke an AWS Lambda function that syncs the bucket with the original knowledge base when a new report is uploaded to the bucket. Use Amazon Comprehend to detect and redact PII before syncing the bucket with the second knowledge base. When a user interacts with the AI assistant, redirect the model to the appropriate knowledge base depending on the user’s Cognito user group.
                    - button "Show Answer" [ref=f4e1193] [cursor=pointer]
                    - generic [ref=f4e1200]:
                      - group "Explanation" [ref=f4e1201]:
                        - paragraph [ref=f4e1203]: Amazon Bedrock Guardrails sensitive-information filters can anonymize PII in model responses. Applying the guardrail appropriate to the authenticated Cognito group allows PII to remain available to surgeons while masking it for engineers. An S3 Lifecycle expiration rule removes reports older than three years, and scheduled daily synchronization updates the Amazon Bedrock knowledge base for S3 additions, changes, and deletions, so expired reports are no longer eligible for retrieval.
