              - generic [ref=f4e2047]:
                - paragraph [ref=f4e2048]: A hotel company wants to improve a legacy Java-based property management system (PMS) by adding AI capabilities. The company plans to use Amazon Bedrock Knowledge Bases to give staff room-availability information and hotel-specific details. The solution must keep separate access controls for every hotel the company manages. It must deliver room-availability information in near real time and maintain consistent performance during peak-use periods.
                - paragraph [ref=f4e2049]: Which solution will satisfy these requirements?
                - generic [ref=f4e2050]:
                  - list [ref=f4e2051]:
                    - listitem [ref=f4e2052] [cursor=pointer]:
                      - strong [ref=f4e2053]: A
                      - text: Deploy a single Amazon Bedrock knowledge base that contains combined data for all hotels. Configure AWS Lambda functions to synchronize data from each hotel's PMS database through direct API connections. Implement AWS CloudTrail logging with hotel-specific filters to audit access logs for each hotel's data.
                    - listitem [ref=f4e2054] [cursor=pointer]:
                      - strong [ref=f4e2055]: B
                      - text: Create an Amazon EventBridge rule for each hotel that is invoked by changes to the PMS database for each hotel. Configure the rule to send updates to a centralized Amazon Bedrock knowledge base in a management AWS account. Configure resource-based policies to enforce hotel-specific access controls for hotel staff.
                    - listitem [ref=f4e2056] [cursor=pointer]:
                      - strong [ref=f4e2057]: C
                      - text: Implement one Amazon Bedrock knowledge base for each hotel in a multi-account structure. Use direct data ingestion to provide real-time room availability information. Schedule regular synchronization for less critical information.
                    - listitem [ref=f4e2058] [cursor=pointer]:
                      - strong [ref=f4e2059]: D
                      - text: Build a centralized Amazon Bedrock agent that uses multiple knowledge bases. Implement AWS IAM Identity Center with hotel-specific permission sets to control hotel staff data access.
                  - button "Show Answer" [ref=f4e2060] [cursor=pointer]
                  - generic [ref=f4e2067]:
                    - group "Explanation" [ref=f4e2068]:
                      - paragraph [ref=f4e2070]: A separate Amazon Bedrock knowledge base for each hotel, deployed in a multi-account structure, isolates each hotel's data and access controls while allowing capacity and performance to be managed independently. Amazon Bedrock Knowledge Bases direct ingestion supports adding, updating, and deleting documents in a single operation without waiting for a data-source sync, which supports near-real-time room-availability updates. Regular synchronization is appropriate for less time-sensitive hotel information.
                    - group "Learn more" [ref=f4e2071]:
