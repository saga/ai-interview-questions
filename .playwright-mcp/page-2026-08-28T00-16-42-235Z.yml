              - generic [ref=f4e1789]:
                - paragraph [ref=f4e1790]: A healthcare company uses Amazon Bedrock to build a real-time patient-care AI assistant that answers queries for separate departments responsible for clinical inquiries, insurance verification, appointment scheduling, and insurance claims. The company wants to use a multi-agent architecture.
                - paragraph [ref=f4e1791]: The company must ensure that the AI assistant is scalable and can onboard new patient features. The AI assistant must be capable of handling thousands of parallel patient interactions. The company must ensure that patients receive suitable domain-specific responses to their queries.
                - paragraph [ref=f4e1792]: Which solution will meet these requirements?
                - generic [ref=f4e1793]:
                  - list [ref=f4e1794]:
                    - listitem [ref=f4e1795] [cursor=pointer]:
                      - strong [ref=f4e1796]: A
                      - text: Isolate data for each agent by using separate knowledge bases. Use IAM filtering to control access to each knowledge base. Deploy a supervisor agent to perform natural language intent classification on patient inquiries. Configure the supervisor agent to route queries to specialized collaborator agents to respond to department-specific queries. Configure each specialized collaborator agent to use Retrieval Augmented Generation (RAG) with the agent's department-specific knowledge base.
                    - listitem [ref=f4e1797] [cursor=pointer]:
                      - strong [ref=f4e1798]: B
                      - text: Create a separate supervisor agent for each department. Configure individual collaborator agents to perform natural language intent classification for each specialty domain within each department. Integrate each collaborator agent with department-specific knowledge bases only. Implement manual handoff processes between the supervisor agents.
                    - listitem [ref=f4e1799] [cursor=pointer]:
                      - strong [ref=f4e1800]: C
                      - text: Isolate data for each department in separate knowledge bases. Use IAM filtering to control access to each knowledge base. Deploy a single general-purpose agent. Configure multiple action groups within the general-purpose agent to perform specific department functions. Implement rule-based routing logic within the general-purpose agent instructions.
                    - listitem [ref=f4e1801] [cursor=pointer]:
                      - strong [ref=f4e1802]: D
                      - text: Implement multiple independent supervisor agents that run in parallel to respond to patient inquiries for each department. Configure multiple collaborator agents for each supervisor agent. Integrate all agents with the same knowledge base. Use external routing logic to merge responses from multiple supervisor agents.
                  - button "Show Answer" [ref=f4e1803] [cursor=pointer]
                  - generic [ref=f4e1810]:
                    - group "Explanation" [ref=f4e1811]:
                      - paragraph [ref=f4e1813]:
                        - text: Amazon Bedrock multi-agent collaboration supports a supervisor agent that routes requests to specialized collaborator agents. Each collaborator can be configured for a distinct department and use its own knowledge base for Retrieval Augmented Generation, which preserves domain specialization and allows capabilities to expand by adding collaborators. The supervisor-with-routing model is designed to send a request to the appropriate collaborator and reduce latency.
                        - link "Use multi-agent collaboration with Amazon Bedrock Agents" [ref=f4e1814] [cursor=pointer]:
                          - /url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-multi-agent-collaboration.html
                        - link "Create multi-agent collaboration" [ref=f4e1815] [cursor=pointer]:
                          - /url: https://docs.aws.amazon.com/bedrock/latest/userguide/create-multi-agent-collaboration.html
