                        - code [ref=f4e1302]: SearchRelevantContent
                        - text: API to retrieve relevant content for prompt augmentation without directly connecting to or indexing every customer data source. Amazon Q supports semantic and hybrid retrieval and applies the customer’s configured access controls.
