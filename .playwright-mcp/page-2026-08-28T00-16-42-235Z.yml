                    - group "Explanation" [ref=f4e865]:
                      - paragraph [ref=f4e867]: Processing data in the originating Region before sending it to Amazon Bedrock supports keeping processing within the required continent, while Region-specific S3 policies keep stored data under the applicable regional controls. Amazon S3 Object Lock provides WORM retention to protect stored records, Amazon Macie discovers and classifies sensitive data in Amazon S3, and CloudTrail provides auditable API activity with log-file integrity validation.
