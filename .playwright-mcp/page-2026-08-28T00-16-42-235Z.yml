              - generic [ref=f4e1362]:
                - paragraph [ref=f4e1363]: An insurance company uses its existing Amazon SageMaker AI infrastructure to support a web-based application that lets customers predict their insurance premiums. The company keeps the customer data used to train the SageMaker AI model in an Amazon S3 bucket. The dataset is growing rapidly.
                - paragraph [ref=f4e1364]: The company needs a solution to continuously retrain the model. When an employee uploads a new customer-data file to the S3 bucket, the solution must automatically retrain and redeploy the model to the application.
                - paragraph [ref=f4e1365]: Which solution meets these requirements?
                - generic [ref=f4e1366]:
                  - list [ref=f4e1367]:
                    - listitem [ref=f4e1368] [cursor=pointer]:
                      - strong [ref=f4e1369]: A
                      - text: Use AWS Glue to run an ETL job on each uploaded file. Configure the ETL job to use the AWS SDK to invoke the Sage Maker AI model endpoint. Use real-time inference with the endpoint to re-deploy the model after it is re-trained on the updated customer dataset.
                    - listitem [ref=f4e1370] [cursor=pointer]:
                      - strong [ref=f4e1371]: B
                      - text: Create an AWS Lambda function and webhook handlers to generate an event when an employee uploads a new file. Configure SageMaker Pipelines to re-deploy the model after it is re-trained on the updated customer dataset. Use Amazon EventBridge to create an event bus. Set the Lambda function event as the source and SageMaker Pipelines as the target.
                    - listitem [ref=f4e1372] [cursor=pointer]:
                      - strong [ref=f4e1373]: C
                      - text: Create an AWS Step Functions Express workflow with AWS SDK integrations to retrieve the customer data from the S3 bucket when an employee uploads a new file to the S3 bucket. Use a SageMaker Data Wrangler flow to export the data from the S3 bucket to SageMaker Autopilot. Use SageMaker Autopilot to re-deploy the model after it has been re-trained on the updated customer dataset.
                    - listitem [ref=f4e1374] [cursor=pointer]:
                      - strong [ref=f4e1375]: D
                      - text: Create an AWS Step Functions Standard workflow. Configure the first state to call an AWS Lambda function to respond when an employee uploads a new file to the S3 bucket. Use a pipeline in SageMaker Pipelines to re-deploy the model after it has been re-trained on the updated customer dataset. Use the next state in the workflow to run the pipeline when the first state receives a response.
                  - button "Show Answer" [ref=f4e1376] [cursor=pointer]
                  - generic [ref=f4e1383]:
                    - group "Explanation" [ref=f4e1384]:
                      - paragraph [ref=f4e1386]:
                        - text: An Amazon S3 upload can trigger a Lambda function, and a Step Functions Standard workflow can coordinate the subsequent model-building process. A SageMaker Pipeline can include the training and model-deployment steps, so starting the pipeline after the upload retrains the model using the updated dataset and redeploys it to the application. SageMaker Pipelines supports deployment steps, and AWS documents EventBridge/S3-driven automation of pipeline executions.
                        - link "Define a pipeline — Amazon SageMaker AI" [ref=f4e1387] [cursor=pointer]:
                          - /url: https://docs.aws.amazon.com/sagemaker/latest/dg/define-pipeline.html
