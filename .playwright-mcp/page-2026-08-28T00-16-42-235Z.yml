              - generic [ref=f4e1096]:
                - paragraph [ref=f4e1097]: A media company must use Amazon Bedrock to establish a robust governance process for AI-generated content. The company must manage hundreds of prompt templates. Multiple teams use the templates in multiple AWS Regions to generate content. The solution must provide version control with approval workflows that include notifications for pending reviews. It must also provide detailed audit trails that record prompt activities and consistent prompt parameterization to enforce quality standards.
                - paragraph [ref=f4e1098]: Which solution will satisfy these requirements?
                - generic [ref=f4e1099]:
                  - list [ref=f4e1100]:
                    - listitem [ref=f4e1101] [cursor=pointer]:
                      - strong [ref=f4e1102]: A
                      - text: Configure Amazon Bedrock Studio prompt templates. Use Amazon CloudWatch to create dashboards that display prompt usage metrics. Store the approval status of content in Amazon DynamoDB. Use AWS Lambda functions to enforce approvals.
                    - listitem [ref=f4e1103] [cursor=pointer]:
                      - strong [ref=f4e1104]: B
                      - text: Use Amazon Bedrock Prompt Management to implement version control. Configure AWS CloudTrail for audit logging. Use IAM policies to control approval permissions. Create parameterized prompt templates by specifying variables.
                    - listitem [ref=f4e1105] [cursor=pointer]:
                      - strong [ref=f4e1106]: C
                      - text: Use AWS Step Functions to create an approval workflow. Store prompts as documents in Amazon S3. Use tags to implement version control. Use Amazon EventBridge to send notifications.
                    - listitem [ref=f4e1107] [cursor=pointer]:
                      - strong [ref=f4e1108]: D
                      - text: Deploy Amazon SageMaker Canvas with prompt templates that are stored in Amazon S3. Use AWS CloudFormation to implement version control. Use AWS Config to enforce approval policies.
                  - button "Show Answer" [ref=f4e1109] [cursor=pointer]
                  - generic [ref=f4e1116]:
                    - group "Explanation" [ref=f4e1117]:
                      - paragraph [ref=f4e1119]: Amazon Bedrock Prompt Management supports reusable prompt templates, versioned prompt snapshots, and prompt variables, which standardize prompt inputs and configurations. AWS CloudTrail records AWS activity with details such as the identity, action, time, and request parameters, creating an auditable history of prompt-management operations. IAM policies can separate and restrict permissions to create, modify, and version prompts, supporting controlled approval processes.
