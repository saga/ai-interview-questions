              - generic [ref=f3e1162]:
                - paragraph [ref=f3e1163]: A financial services company is building a Retrieval Augmented Generation (RAG) application to help investment analysts query complex financial relationships spanning multiple investment vehicles, market sectors, and regulatory environments. The dataset includes highly interconnected entities with multi-hop relationships. Analysts must be able to review these relationships holistically to deliver accurate investment guidance. The application must provide comprehensive answers that include indirect relationships among financial entities. The application must return responses in under 3 seconds.
                - paragraph [ref=f3e1164]:
                  - text: Which solution meets these requirements with the
                  - strong [ref=f3e1165]: LEAST
                  - text: operational overhead?
                - generic [ref=f3e1166]:
                  - list [ref=f3e1167]:
                    - listitem [ref=f3e1168] [cursor=pointer]:
                      - strong [ref=f3e1169]: A
                      - text: Use Amazon Bedrock Knowledge Bases with Graph RAG and Amazon Neptune Analytics to store the financial data. Analyze the multi-hop relationships between entities and automatically identify related information across documents.
                    - listitem [ref=f3e1170] [cursor=pointer]:
                      - strong [ref=f3e1171]: B
                      - text: Use Amazon Bedrock Knowledge Bases and an Amazon OpenSearch Service vector store to implement custom relationship identification logic that uses AWS Lambda functions to query multiple vector embeddings in sequence.
                    - listitem [ref=f3e1172] [cursor=pointer]:
                      - strong [ref=f3e1173]: C
                      - text: Use an Amazon OpenSearch Serverless vector database with k-nearest neighbor (k-NN) searches. Implement manual relationship mapping in an application layer that runs in an Amazon EC2 Auto Scaling group.
                    - listitem [ref=f3e1174] [cursor=pointer]:
                      - strong [ref=f3e1175]: D
                      - text: Use Amazon DynamoDB to store financial data in a custom indexing system. Use an AWS Lambda function to query relevant records based on input questions. Use Amazon SageMaker AI to generate responses.
                  - button "Show Answer" [ref=f3e1176] [cursor=pointer]
                  - generic [ref=f3e1183]:
                    - group "Explanation" [ref=f3e1184]:
                      - paragraph [ref=f3e1186]: Amazon Bedrock Knowledge Bases GraphRAG with Amazon Neptune Analytics is a fully managed graph-based RAG solution that automatically identifies entity relationships and traverses related graph nodes. It is designed to connect information through multiple logical steps, producing comprehensive, contextually relevant responses for highly interconnected data while avoiding custom relationship-mapping and query-orchestration infrastructure.
