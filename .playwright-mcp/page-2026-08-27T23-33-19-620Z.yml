              - generic [ref=f3e228]:
                - paragraph [ref=f3e229]: A company plans to establish an annual customer rewards program. The rewards customers earn differ according to various parameters, including the categories of items they order and the customers' purchase history.
                - paragraph [ref=f3e230]: The company requires a generative AI (GenAI) solution that uses three Amazon Bedrock agents to assist customers while they browse an online catalog. The agents must use knowledge bases and action groups to manage the search, recommendation, and order modules. The modules must run sequentially. An AWS Lambda function must calculate estimated rewards for every recommended item. The solution must offer graceful degradation during service disruptions.
                - paragraph [ref=f3e231]:
                  - text: Which solution meets these requirements with the
                  - strong [ref=f3e232]: MOST
                  - text: operational efficiency?
                - generic [ref=f3e233]:
                  - list [ref=f3e234]:
                    - listitem [ref=f3e235] [cursor=pointer]:
                      - strong [ref=f3e236]: A
                      - text: Define an Amazon API Gateway REST API behind each agent. Create a second Lambda function to orchestrate the calls to the agents and the rewards Lambda function. Configure the second Lambda function with a retry/fallback mechanism.
                    - listitem [ref=f3e237] [cursor=pointer]:
                      - strong [ref=f3e238]: B
                      - text: Create an AWS Step Functions state machine with four tasks that run the agents and the rewards Lambda function. Set up retry and catch branches for each of the task steps.
                    - listitem [ref=f3e239] [cursor=pointer]:
                      - strong [ref=f3e240]: C
                      - text: Configure each agent with a separate retry/fallback mechanism. Create a second Lambda function to orchestrate the calls to the agents and the rewards Lambda function. Define an Amazon API Gateway REST API behind the second Lambda function.
                    - listitem [ref=f3e241] [cursor=pointer]:
                      - strong [ref=f3e242]: D
                      - text: Create a second Lambda function to orchestrate the calls to the agents and the rewards Lambda function. Create an AWS Step Functions state machine with one task that runs the second Lambda function. Set up retry and catch branches for the task step.
                  - button "Hide Answer" [expanded] [active] [ref=f3e2363] [cursor=pointer]
                  - generic [ref=f3e250]:
                    - group "Explanation" [ref=f3e251]:
                      - paragraph [ref=f3e253]:
                        - text: AWS Step Functions provides managed orchestration for sequential service tasks and supports task-level
                        - code [ref=f3e254]: Retry
                        - text: and
