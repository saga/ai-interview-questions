              - generic [ref=f3e1246]:
                - paragraph [ref=f3e1247]: A company uses Amazon Bedrock to build an AI-powered application with a foundation model (FM) that supports cross-Region inference and provisioned throughput. The application must provide consistently low latency to users in Europe and North America. It must also comply with data-residency regulations requiring European user data to stay in Europe-based AWS Regions.
                - paragraph [ref=f3e1248]: During testing, the application has service degradation when Regional traffic spikes reach service quotas. The company requires a solution that preserves application resilience while minimizing operational complexity.
                - paragraph [ref=f3e1249]: Which solution meets these requirements?
                - generic [ref=f3e1250]:
                  - list [ref=f3e1251]:
                    - listitem [ref=f3e1252] [cursor=pointer]:
                      - strong [ref=f3e1253]: A
                      - text: Deploy separate Amazon Bedrock instances in North American and European Regions. Use a custom routing layer that directs traffic based on user location. Configure Amazon CloudWatch alarms to monitor Regional service usage. Use Amazon SNS to send email alerts to the company when usage approaches specified thresholds.
                    - listitem [ref=f3e1254] [cursor=pointer]:
                      - strong [ref=f3e1255]: B
                      - text: Use Amazon Bedrock cross-Region inference profiles by specifying geographical codes in profile IDs when the application calls the InvokeModel API. Configure separate Amazon API Gateway HTTP APIs to direct European and North American users to the appropriate Regional endpoints.
                    - listitem [ref=f3e1256] [cursor=pointer]:
                      - strong [ref=f3e1257]: C
                      - text: Deploy a multi-Region Amazon API Gateway HTTP API and AWS Lambda functions that implement retry logic to handle throttling. Configure the Lambda functions to call the FM in the nearest secondary Region when the application reaches service quotas in the primary Region. Use intelligent routing to ensure compliance with data residency requirements.
                    - listitem [ref=f3e1258] [cursor=pointer]:
                      - strong [ref=f3e1259]: D
                      - text: Configure provisioned throughput for Amazon Bedrock in multiple Regions. Implement failover logic in the application code to switch between Regions when throttling occurs. Use AWS Global Accelerator to route traffic to the appropriate endpoints based on user location.
                  - button "Show Answer" [ref=f3e1260] [cursor=pointer]
                  - generic [ref=f3e1267]:
                    - group "Explanation" [ref=f3e1268]:
                      - paragraph [ref=f3e1270]: Geographic Amazon Bedrock cross-Region inference profiles automatically route invocations among the supported Regions within a specified geography, such as the EU or US. This increases available throughput and handles unplanned traffic bursts without custom Regional failover logic. An EU geographic profile confines processing to EU Regions, supporting European data-residency requirements; separate regional API endpoints can direct each user population to the applicable geographic profile. Amazon Bedrock inference profiles currently do not support Provisioned Throughput.
                    - group "Learn more" [ref=f3e1271]:
                      - list [ref=f3e1273]:
                        - listitem [ref=f3e1274]:
                          - link "Increase throughput with cross-Region inference - Amazon Bedrock" [ref=f3e1275] [cursor=pointer]:
