              - generic [ref=f3e1916]:
                - paragraph [ref=f3e1917]: An e-commerce company is building an internal platform for developing generative AI applications with Amazon Bedrock foundation models (FMs). Developers must choose models based on evaluations aligned with e-commerce use cases. The platform must show accuracy metrics for text generation and summarization in dashboards. The company has custom e-commerce datasets to use as standardized evaluation inputs.
