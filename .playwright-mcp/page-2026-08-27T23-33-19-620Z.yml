              - generic [ref=f3e988]:
                - paragraph [ref=f3e989]: A company upgraded its Amazon Bedrock-powered foundation model (FM) that supports a multilingual customer service assistant. Following the upgrade, the assistant showed inconsistent behavior between languages. It started producing different responses in some languages for identical questions.
                - paragraph [ref=f3e990]: "The company needs a solution to identify and remediate similar issues in future updates. The evaluation must:"
                - list [ref=f3e991]:
                  - listitem [ref=f3e992]: Complete within 45 minutes for every supported language.
                  - listitem [ref=f3e993]: Process at least 15,000 test conversations concurrently.
                  - listitem [ref=f3e994]: Be fully automated and integrated into the CI/CD pipeline.
                  - listitem [ref=f3e995]: Prevent deployment when quality thresholds are not met.
                - paragraph [ref=f3e996]: Which solution meets these requirements?
                - generic [ref=f3e997]:
                  - list [ref=f3e998]:
                    - listitem [ref=f3e999] [cursor=pointer]:
                      - strong [ref=f3e1000]: A
                      - text: Create a distributed traffic simulation framework that sends translation-heavy workloads to the assistant in multiple languages simultaneously. Use Amazon CloudWatch metrics to monitor latency, concurrency, and throughput. Run simulations before production releases to identify infrastructure bottlenecks.
                    - listitem [ref=f3e1001] [cursor=pointer]:
                      - strong [ref=f3e1002]: B
                      - text: Deploy the assistant in multiple AWS Regions with Amazon Route 53 latency-based routing and AWS Global Accelerator to improve global performance. Store multilingual conversation logs in Amazon S3. Perform weekly post-deployment audits to review consistency.
                    - listitem [ref=f3e1003] [cursor=pointer]:
                      - strong [ref=f3e1004]: C
                      - text: Create a pre-processing pipeline that normalizes all incoming messages into a consistent format before sending the messages to the assistant. Apply rule-based checks to flag potential hallucinations in the outputs. Focus the evaluation on the normalized text to simplify testing across languages.
                    - listitem [ref=f3e1005] [cursor=pointer]:
                      - strong [ref=f3e1006]: D
                      - text: Set up standardized multilingual test conversations with identical meaning. Run the test conversations in parallel by using Amazon Bedrock model evaluation jobs. Apply similarity and hallucination thresholds. Integrate the process into the CI/CD pipeline to block releases that fail.
                  - button "Show Answer" [ref=f3e1007] [cursor=pointer]
                  - generic [ref=f3e1014]:
                    - group "Explanation" [ref=f3e1015]:
                      - paragraph [ref=f3e1017]:
                        - text: Amazon Bedrock automatic model evaluation jobs can run programmatically against a custom prompt dataset and produce computed quality metrics. Standardized conversations with the same meaning in each supported language make inconsistent multilingual responses measurable; similarity and hallucination thresholds provide objective release criteria. Invoking the evaluation from CI/CD and failing the pipeline when those criteria are not met creates the required automated deployment gate.
                        - 'link "AWS: Evaluate the performance of Amazon Bedrock resources" [ref=f3e1018] [cursor=pointer]':
                          - /url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
