                        - text: error handling. A state machine can invoke the three Amazon Bedrock agents in order and then invoke the rewards-calculation Lambda function. Configuring retry and catch branches for each task enables targeted recovery or fallback behavior when an individual agent or function fails, without maintaining custom Lambda orchestration and error-handling code.
