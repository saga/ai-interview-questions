              - generic [ref=f3e816]:
                - paragraph [ref=f3e817]: A GenAI developer is developing a Retrieval Augmented Generation (RAG)-based customer-support application that uses Amazon Bedrock foundation models (FMs). The application must process 50 GB of historical customer conversations stored as JSON files in an Amazon S3 bucket. It must use the processed data as its retrieval corpus.
                - paragraph [ref=f3e818]: The application's data-processing workflow must extract relevant data from customer-support documents, remove customer personally identifiable information (PII), and generate embeddings for vector storage. The workflow must be cost-effective and complete within 4 hours.
                - paragraph [ref=f3e819]:
                  - text: Which solution meets these requirements with the
                  - strong [ref=f3e820]: LEAST
                  - text: operational overhead?
                - generic [ref=f3e821]:
                  - list [ref=f3e822]:
                    - listitem [ref=f3e823] [cursor=pointer]:
                      - strong [ref=f3e824]: A
                      - text: Use AWS Lambda and Amazon Comprehend to process files in parallel, remove PII, and call Amazon Bedrock APIs to generate vectors. Configure Lambda concurrency limits and memory settings to optimize throughput.
                    - listitem [ref=f3e825] [cursor=pointer]:
                      - strong [ref=f3e826]: B
                      - text: Create an AWS Glue ETL job to run PII detection scripts on the data. Use Amazon SageMaker Processing to run the HuggingFaceProcessor to generate embeddings by using a pre-trained model. Store the embeddings in Amazon OpenSearch Service.
                    - listitem [ref=f3e827] [cursor=pointer]:
                      - strong [ref=f3e828]: C
                      - text: Deploy an Amazon EMR cluster that runs Apache Spark with user-defined functions (UDFs) that call Amazon Comprehend to detect PII. Use Amazon Bedrock APIs to generate vectors. Store outputs in Amazon Aurora PostgreSQL with the pgvector extension.
                    - listitem [ref=f3e829] [cursor=pointer]:
                      - strong [ref=f3e830]: D
                      - text: Implement a data processing pipeline that uses AWS Step Functions to orchestrate a workload that uses Amazon Comprehend to detect PII and Amazon Bedrock to generate embeddings. Directly integrate the workflow with Amazon OpenSearch Serverless to store vectors and provide similarity search capabilities.
