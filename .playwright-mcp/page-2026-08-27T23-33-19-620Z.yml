              - generic [ref=f3e1078]:
                - paragraph [ref=f3e1079]: A large ecommerce company has deployed a foundation model (FM) to create product descriptions. The company’s engineering team uses Amazon CloudWatch to monitor technical metrics such as token usage, latency, and error rates. Its marketing team tracks business metrics, including conversion rates and revenue impact, in separate systems.
                - paragraph [ref=f3e1080]: The company requires a unified observability solution that correlates technical performance with business outcomes. The solution must automatically alert stakeholders when operational metrics show degradation. It must also deliver comprehensive visibility across both technical and business metrics.
                - paragraph [ref=f3e1081]: Which solution meets these requirements?
                - generic [ref=f3e1082]:
                  - list [ref=f3e1083]:
                    - listitem [ref=f3e1084] [cursor=pointer]:
                      - strong [ref=f3e1085]: A
                      - text: Create CloudWatch dashboards that include technical metrics and imported business metrics. Configure CloudWatch composite alarms that combine technical data and business data. Use Amazon SNS to set up notifications to stakeholders.
                    - listitem [ref=f3e1086] [cursor=pointer]:
                      - strong [ref=f3e1087]: B
                      - text: Use Amazon Managed Grafana to visualize technical metrics from CloudWatch with business metrics from external sources. Configure Amazon Managed Grafana alerts to invoke AWS Lambda functions. Configure the Lambda functions to remediate issues automatically when metrics exceed predefined thresholds.
                    - listitem [ref=f3e1088] [cursor=pointer]:
                      - strong [ref=f3e1089]: C
                      - text: Stream CloudWatch metrics to Amazon S3 by using CloudWatch metric streams. Create Amazon QuickSight dashboards to visualize the combined technical metrics and business metrics. Set up Amazon EventBridge rules to send notifications to stakeholders when metrics exceed predefined thresholds.
                    - listitem [ref=f3e1090] [cursor=pointer]:
                      - strong [ref=f3e1091]: D
                      - text: Configure CloudWatch custom dashboards that integrate operational metrics with imported business metrics. Set up CloudWatch composite alarms with anomaly detection. Use Amazon SNS to create alarm actions to notify stakeholders when correlated metrics indicate performance issues.
                  - button "Show Answer" [ref=f3e1092] [cursor=pointer]
                  - generic [ref=f3e1099]:
                    - group "Explanation" [ref=f3e1100]:
                      - paragraph [ref=f3e1102]: Business metrics can be imported or published as CloudWatch custom metrics and shown with operational metrics in CloudWatch dashboards. Metric alarms can monitor each metric, and CloudWatch composite alarms use Boolean logic over underlying alarm states to represent correlated technical and business conditions. A composite alarm can send state-change notifications to stakeholders through Amazon SNS.
                    - group "Learn more" [ref=f3e1103]:
                      - list [ref=f3e1105]:
