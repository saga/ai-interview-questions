              - generic [ref=f3e2087]:
                - paragraph [ref=f3e2088]: A company is developing an AI advisory application with Amazon Bedrock that will provide recommendations to customers. The company requires the application to explain its reasoning and cite specific data sources. It must retrieve information from company data sources and present step-by-step reasoning for its recommendations. It must also connect data claims to source documents and keep response latency below 3 seconds.
