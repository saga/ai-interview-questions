              - generic [ref=f3e1749]:
                - paragraph [ref=f3e1750]: A company is developing an API for a generative AI (GenAI) application that uses a foundation model (FM) hosted on a managed model service. The API must stream responses to lower latency, enforce token limits to control compute resource usage, and implement retry logic for model timeouts and partial responses.
                - paragraph [ref=f3e1751]:
                  - text: Which solution meets these requirements with the
                  - strong [ref=f3e1752]: LEAST
                  - text: operational overhead?
                - generic [ref=f3e1753]:
                  - list [ref=f3e1754]:
                    - listitem [ref=f3e1755] [cursor=pointer]:
                      - strong [ref=f3e1756]: A
                      - text: Integrate an Amazon API Gateway HTTP API with an AWS Lambda function to invoke Amazon Bedrock. Use Lambda response streaming to stream responses. Enforce token limits within the Lambda function. Implement retry logic for model timeouts by using Lambda and API Gateway timeout configurations.
                    - listitem [ref=f3e1757] [cursor=pointer]:
                      - strong [ref=f3e1758]: B
                      - text: Connect an Amazon API Gateway HTTP API directly to Amazon Bedrock. Simulate streaming by using client-side polling. Enforce token limits on the frontend. Configure retry behavior by using API Gateway integration settings.
                    - listitem [ref=f3e1759] [cursor=pointer]:
                      - strong [ref=f3e1760]: C
                      - text: Connect an Amazon API Gateway WebSocket API to an Amazon ECS service that hosts a containerized inference server. Stream responses by using the WebSocket protocol. Enforce token limits within Amazon ECS. Handle model timeouts by using ECS task lifecycle hooks and restart policies.
                    - listitem [ref=f3e1761] [cursor=pointer]:
                      - strong [ref=f3e1762]: D
                      - text: Integrate an Amazon API Gateway REST API with an AWS Lambda function that invokes Amazon Bedrock. Use Lambda response streaming to stream responses. Enforce token limits within the Lambda function. Implement retry logic by using Lambda and API Gateway timeout configurations.
                  - button "Show Answer" [ref=f3e1763] [cursor=pointer]
                  - generic [ref=f3e1770]:
                    - group "Explanation" [ref=f3e1771]:
                      - paragraph [ref=f3e1773]: API Gateway response payload streaming is supported for REST APIs and Lambda proxy integrations, allowing Lambda to relay incremental Amazon Bedrock model output rather than waiting for a complete response. Lambda is also an appropriate centralized layer for enforcing token limits and handling timeout or partial-response retries, while avoiding the operational management of a containerized inference service. API Gateway HTTP APIs do not support this response-streaming capability.
