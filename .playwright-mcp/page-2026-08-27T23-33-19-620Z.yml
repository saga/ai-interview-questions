              - generic [ref=f3e1581]:
                - paragraph [ref=f3e1582]: A company uses Amazon Bedrock to build an AI assistant that provides customer support. Analysis indicates that 40% of customer queries use different phrasing or wording to ask the same questions.
                - paragraph [ref=f3e1583]: The company needs a solution that reduces redundant model calls, ensures semantically equivalent questions receive consistent answers, and provides low latency.
                - paragraph [ref=f3e1584]: Which solution meets these requirements?
                - generic [ref=f3e1585]:
                  - list [ref=f3e1586]:
                    - listitem [ref=f3e1587] [cursor=pointer]:
                      - strong [ref=f3e1588]: A
                      - text: Deploy an Amazon DynamoDB Accelerator (DAX) cluster as an in-memory cache. Specify the query text as the partition key and the model response text as the sort key. Query the cache by using a filter expression with the LIKE operator.
                    - listitem [ref=f3e1589] [cursor=pointer]:
                      - strong [ref=f3e1590]: B
                      - text: Use Amazon Bedrock to generate embeddings from customer queries. Use Amazon MemoryDB for Valkey to store hash sets of vector embeddings and model responses. Use a RANGE query to find similar queries and their responses.
                    - listitem [ref=f3e1591] [cursor=pointer]:
                      - strong [ref=f3e1592]: C
                      - text: Deploy Amazon OpenSearch Service that has k-nearest neighbor (k-NN) capabilities to store query-response text pairs. Use an approximate k-NN technique to find similar queries and their responses.
                    - listitem [ref=f3e1593] [cursor=pointer]:
                      - strong [ref=f3e1594]: D
                      - text: Create a caching solution by using Amazon DynamoDB to create a global secondary index on the normalized query text. Apply stemming to incoming queries. Query the index of cached customer queries.
                  - button "Show Answer" [ref=f3e1595] [cursor=pointer]
                  - generic [ref=f3e1602]:
                    - group "Explanation" [ref=f3e1603]:
                      - paragraph [ref=f3e1605]: Vector embeddings represent semantic meaning, allowing differently worded but equivalent customer queries to be matched by similarity. Amazon OpenSearch Service supports vector k-nearest-neighbor search, and approximate k-NN methods such as HNSW provide faster searches on large datasets. Storing cached query-response pairs in OpenSearch and retrieving the nearest semantic match avoids redundant model calls while returning a consistent cached response.
