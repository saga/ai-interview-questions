              - generic [ref=f3e401]:
                - paragraph [ref=f3e402]: A company is developing a generative AI (GenAI) application that generates content from a range of internal and external data sources. The company needs to ensure that all generated output is fully traceable. The application must support registering data sources and allow metadata tagging to attribute content to its original source. It must also retain audit logs of data access and usage across the entire pipeline.
                - paragraph [ref=f3e403]: Which solution meets these requirements?
                - generic [ref=f3e404]:
                  - list [ref=f3e405]:
                    - listitem [ref=f3e406] [cursor=pointer]:
                      - strong [ref=f3e407]: A
                      - text: Use AWS Lake Formation to catalog data sources and control access. Apply metadata tags directly in Amazon S3. Use AWS CloudTrail to monitor API activity.
                    - listitem [ref=f3e408] [cursor=pointer]:
                      - strong [ref=f3e409]: B
                      - text: Use AWS Glue Data Catalog to register and tag data sources. Use Amazon CloudWatch Logs to monitor access patterns and application behavior.
                    - listitem [ref=f3e410] [cursor=pointer]:
                      - strong [ref=f3e411]: C
                      - text: Store data in Amazon S3 and use object tagging for attribution. Use AWS Glue Data Catalog to manage schema information. Use AWS CloudTrail to log access to S3 buckets.
                    - listitem [ref=f3e412] [cursor=pointer]:
                      - strong [ref=f3e413]: D
                      - text: Use AWS Glue Data Catalog to register all data sources. Apply metadata tags to attribute data sources. Use AWS CloudTrail to log access and activity across services.
                  - button "Show Answer" [ref=f3e414] [cursor=pointer]
                  - generic [ref=f3e421]:
                    - group "Explanation" [ref=f3e422]:
                      - paragraph [ref=f3e424]: AWS Glue Data Catalog centralizes data-source registration and metadata management, including tags that can preserve source attribution. AWS CloudTrail records API activity across AWS services, providing an audit trail for data access and pipeline activity.
                    - group "Learn more" [ref=f3e425]:
