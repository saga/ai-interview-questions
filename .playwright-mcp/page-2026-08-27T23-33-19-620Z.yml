              - generic [ref=f3e315]:
                - paragraph [ref=f3e316]: A company uses an AWS Organizations organization with all features enabled to manage multiple AWS accounts. Employees use Amazon Bedrock in multiple accounts. The company must prevent particular topics and proprietary information from being included in prompts submitted to Amazon Bedrock models. The company must ensure that employees can use only approved Amazon Bedrock models. The company centrally administers IAM roles for employees.
                - paragraph [ref=f3e317]: Which combination of solutions will satisfy these requirements?
                - generic [ref=f3e318]:
                  - generic [ref=f3e319]: Choose two
                  - list [ref=f3e320]:
                    - listitem [ref=f3e321] [cursor=pointer]:
                      - strong [ref=f3e322]: A
                      - text: Create an IAM permissions boundary for each employee's IAM role. Configure the permissions boundary to require an approved Amazon Bedrock guardrail identifier to invoke Amazon Bedrock models. Create an SCP that allows employees to use only approved models.
                    - listitem [ref=f3e323] [cursor=pointer]:
                      - strong [ref=f3e324]: B
                      - text: Create an SCP that allows employees to use only approved models. Configure the SCP to require employees to specify a guardrail identifier in calls to invoke an approved model.
                    - listitem [ref=f3e325] [cursor=pointer]:
                      - strong [ref=f3e326]: C
                      - text: Create an SCP that prevents an employee from invoking a model if a centrally deployed guardrail identifier is not specified in a call to the model. Create a permissions boundary on each employee's IAM role that allows each employee to invoke only approved models.
                    - listitem [ref=f3e327] [cursor=pointer]:
                      - strong [ref=f3e328]: D
                      - text: Use AWS CloudFormation to create a custom Amazon Bedrock guardrail that has a block filtering policy. Use stack sets to deploy the guardrail to each account in the organization.
                    - listitem [ref=f3e329] [cursor=pointer]:
                      - strong [ref=f3e330]: E
                      - text: Use AWS CloudFormation to create a custom Amazon Bedrock guardrail that has a mask filtering policy. Use stack sets to deploy the guardrail to each account in the organization.
                  - button "Show Answer" [ref=f3e331] [cursor=pointer]
                  - generic [ref=f3e338]:
                    - group "Explanation" [ref=f3e339]:
                      - paragraph [ref=f3e341]: Amazon Bedrock Guardrails can block denied topics and sensitive information in model input prompts. A block filtering policy prevents the content from being processed, whereas a mask policy redacts detected values. Deploying the guardrail configuration through AWS CloudFormation StackSets provides consistent central deployment to member accounts. An SCP can explicitly deny model invocations that do not include the required guardrail identifier, while permissions boundaries on centrally managed employee roles restrict invocation permissions to approved model resources.
                    - group "Learn more" [ref=f3e342]:
                      - list [ref=f3e344]:
                        - listitem [ref=f3e345]:
                          - link "Enforce the use of specific guardrails in model inference requests" [ref=f3e346] [cursor=pointer]:
                            - /url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
                        - listitem [ref=f3e347]:
