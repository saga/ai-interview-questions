              - generic [ref=f3e2257]:
                - paragraph [ref=f3e2258]: A media company is releasing a platform that enables thousands of users each hour to upload images and text content. The platform uses Amazon Bedrock to process uploaded content and generate creative compositions.
                - paragraph [ref=f3e2259]: The company requires a solution that ensures the platform neither processes nor produces inappropriate content. The platform must not reveal personally identifiable information (PII) in the compositions. The solution must integrate with the company’s existing Amazon S3 storage workflow.
                - paragraph [ref=f3e2260]:
                  - text: Which solution meets these requirements with the
                  - strong [ref=f3e2261]: LEAST
                  - text: infrastructure-management overhead?
                - generic [ref=f3e2262]:
                  - list [ref=f3e2263]:
                    - listitem [ref=f3e2264] [cursor=pointer]:
                      - strong [ref=f3e2265]: A
                      - text: Enable the Enhanced Monitoring tool. Use an Amazon CloudWatch alarm to filter traffic to the platform. Use Amazon Comprehend PII detection to pre-process the data. Create a CloudWatch alarm to monitor for Amazon Comprehend PII detection events. Create an AWS Step Functions workflow that includes an Amazon Rekognition image moderation step.
                    - listitem [ref=f3e2266] [cursor=pointer]:
                      - strong [ref=f3e2267]: B
                      - text: Use an Amazon API Gateway HTTP API with request validation templates to screen content before storing the uploaded content in Amazon S3. Use Amazon SageMaker AI to build custom content moderation models that process content before sending the processed content to Amazon Bedrock.
                    - listitem [ref=f3e2268] [cursor=pointer]:
                      - strong [ref=f3e2269]: C
                      - text: Create an Amazon Cognito user pool that uses pre-authentication AWS Lambda functions to run content moderation checks. Use Amazon Textract to filter text content and Amazon Rekognition to filter image content before allowing users to upload content to the platform.
                    - listitem [ref=f3e2270] [cursor=pointer]:
                      - strong [ref=f3e2271]: D
                      - text: Create an AWS Step Functions workflow that uses built-in Amazon Bedrock guardrails to filter content. Use Amazon Comprehend PII detection to pre-process the content. Use Amazon Rekognition image moderation.
                  - button "Show Answer" [ref=f3e2272] [cursor=pointer]
                  - generic [ref=f3e2279]:
                    - group "Explanation" [ref=f3e2280]:
                      - paragraph [ref=f3e2282]: Amazon Bedrock Guardrails supplies managed content filters for harmful text and images and sensitive-information controls for PII in model inputs and responses. Amazon Comprehend PII detection can preprocess uploaded text, and Amazon Rekognition moderation can evaluate uploaded images. AWS Step Functions can orchestrate these managed checks as part of an Amazon S3-based workflow without building and operating custom moderation models or separate request-screening infrastructure.
                    - group "Learn more" [ref=f3e2283]:
                      - list [ref=f3e2285]:
                        - listitem [ref=f3e2286]:
                          - link "Create your guardrail - Amazon Bedrock" [ref=f3e2287] [cursor=pointer]:
                            - /url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-components.html
