              - generic [ref=f3e1330]:
                - paragraph [ref=f3e1331]: A company is developing a legal-research AI assistant that uses Amazon Bedrock with an Anthropic Claude foundation model (FM). The AI assistant must retrieve highly relevant case-law documents to augment the FM’s responses. It must recognize semantic relationships among legal concepts, specific legal terminology, and citations. The AI assistant must operate quickly and return precise results.
                - paragraph [ref=f3e1332]: Which solution meets these requirements?
                - generic [ref=f3e1333]:
                  - list [ref=f3e1334]:
                    - listitem [ref=f3e1335] [cursor=pointer]:
                      - strong [ref=f3e1336]: A
                      - text: Configure an Amazon Bedrock knowledge base to use a default vector search configuration. Use Amazon Bedrock to expand queries to improve retrieval for legal documents based on specific terminology and citations.
                    - listitem [ref=f3e1337] [cursor=pointer]:
                      - strong [ref=f3e1338]: B
                      - text: Use Amazon OpenSearch service to deploy a hybrid search architecture that combines vector search with keyword search. Apply an Amazon Bedrock reranker model to optimize result relevance.
                    - listitem [ref=f3e1339] [cursor=pointer]:
                      - strong [ref=f3e1340]: C
                      - text: Enable the Amazon Kendra query suggestion feature for end users. Use Amazon Bedrock to perform post-processing of search results to identify semantic similarity in the documents and to produce precise results.
                    - listitem [ref=f3e1341] [cursor=pointer]:
                      - strong [ref=f3e1342]: D
                      - text: Use Amazon OpenSearch Service with vector search and Amazon Bedrock Titan embeddings to index and search legal documents. Use custom AWS Lambda functions to merge results with keyword-based filters that are stored in an Amazon RDS database.
                  - button "Show Answer" [ref=f3e1343] [cursor=pointer]
                  - generic [ref=f3e1350]:
                    - group "Explanation" [ref=f3e1351]:
                      - paragraph [ref=f3e1353]: Amazon OpenSearch Service hybrid search combines vector-based semantic retrieval with keyword search, enabling retrieval based on both conceptual legal relationships and exact legal terminology or citations. An Amazon Bedrock reranker evaluates and reorders the retrieved documents by query relevance, improving precision and allowing fewer, more relevant results to be passed to the foundation model, which can also reduce latency.
