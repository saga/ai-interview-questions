              - generic [ref=f3e1665]:
                - paragraph [ref=f3e1666]: A medical company is developing a generative AI (GenAI) application that uses RAG to deliver evidence-based medical information. The application uses Amazon OpenSearch Service to retrieve vector embeddings. Users report that searches often miss results containing exact medical terms and acronyms, while returning too many semantically similar but irrelevant documents. The company must improve retrieval quality while keeping end-user latency low, even as the document collection scales to millions of documents.
                - paragraph [ref=f3e1667]:
                  - text: Which solution meets these requirements with the
                  - strong [ref=f3e1668]: LEAST
                  - text: operational overhead?
                - generic [ref=f3e1669]:
                  - list [ref=f3e1670]:
                    - listitem [ref=f3e1671] [cursor=pointer]:
                      - strong [ref=f3e1672]: A
                      - text: Configure hybrid search by combining vector similarity with keyword matching to improve semantic understanding and exact term and acronym matching.
                    - listitem [ref=f3e1673] [cursor=pointer]:
                      - strong [ref=f3e1674]: B
                      - text: Increase the dimensions of the vector embeddings from 384 to 1536. Use a post-processing AWS Lambda function to filter out irrelevant results after retrieval.
                    - listitem [ref=f3e1675] [cursor=pointer]:
                      - strong [ref=f3e1676]: C
                      - text: Replace OpenSearch Service with Amazon Kendra. Use query expansion to handle medical acronyms and terminology variants during pre-processing.
                    - listitem [ref=f3e1677] [cursor=pointer]:
                      - strong [ref=f3e1678]: D
                      - text: Implement a two-stage retrieval architecture in which initial vector search results are re-ranked by an ML model that is hosted on Amazon SageMaker AI.
                  - button "Show Answer" [ref=f3e1679] [cursor=pointer]
                  - generic [ref=f3e1686]:
                    - group "Explanation" [ref=f3e1687]:
                      - paragraph [ref=f3e1689]: Hybrid search combines keyword matching, which retrieves exact medical terminology and acronyms, with vector similarity search, which preserves semantic relevance. Amazon OpenSearch Service supports hybrid search for combining keyword and semantic search capabilities, so it improves relevance without introducing separate post-processing or ML reranking infrastructure and its associated latency and operational overhead.
