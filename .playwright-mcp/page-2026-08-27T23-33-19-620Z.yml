              - generic [ref=f3e901]:
                - paragraph [ref=f3e902]: A company uses Amazon Bedrock to create technical content for customers. The company has recently seen a surge in hallucinated outputs when its model produces summaries of lengthy technical documents. The outputs contain incorrect or invented details. The current solution uses a large foundation model (FM) with a basic one-shot prompt that supplies the complete document in one input.
                - paragraph [ref=f3e903]: The company needs a solution that reduces hallucinations and satisfies factual-accuracy objectives. The solution must process more than 1,000 documents per hour and provide summaries within 3 seconds for each document.
                - paragraph [ref=f3e904]: Which combination of solutions meets these requirements?
                - generic [ref=f3e905]:
                  - generic [ref=f3e906]: Choose two
                  - list [ref=f3e907]:
                    - listitem [ref=f3e908] [cursor=pointer]:
                      - strong [ref=f3e909]: A
                      - text: Implement zero-shot chain-of-thought (CoT) instructions that require step-by-step reasoning with explicit fact verification before the model generates each summary.
                    - listitem [ref=f3e910] [cursor=pointer]:
                      - strong [ref=f3e911]: B
                      - text: Use Retrieval Augmented Generation (RAG) with an Amazon Bedrock knowledge base. Apply semantic chunking and tuned embeddings to ground summaries in source content.
                    - listitem [ref=f3e912] [cursor=pointer]:
                      - strong [ref=f3e913]: C
                      - text: Configure Amazon Bedrock guardrails to block any generated output that matches patterns that are associated with hallucinated content.
                    - listitem [ref=f3e914] [cursor=pointer]:
                      - strong [ref=f3e915]: D
                      - text: Increase the temperature parameter in Amazon Bedrock.
                    - listitem [ref=f3e916] [cursor=pointer]:
                      - strong [ref=f3e917]: E
                      - text: Prompt the Amazon Bedrock model to summarize each full document in one pass.
                  - button "Show Answer" [ref=f3e918] [cursor=pointer]
                  - generic [ref=f3e925]:
                    - group "Explanation" [ref=f3e926]:
                      - paragraph [ref=f3e928]: Retrieval Augmented Generation grounds summaries in semantically retrieved source chunks, reducing unsupported details while avoiding the cost and context limitations of passing an entire long document in one prompt. Amazon Bedrock Knowledge Bases automate document chunking, embeddings, retrieval, and response generation with source citations. Explicit chain-of-thought instructions that require fact verification add a prompt-level check for whether a proposed summary is supported by the provided evidence. Pattern-based output blocking does not establish factual grounding, higher temperature increases generation variability, and one-pass full-document prompting retains the original hallucination-prone design.
