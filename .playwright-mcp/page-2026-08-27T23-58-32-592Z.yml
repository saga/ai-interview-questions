            - generic [ref=f7e413]:
              - generic [ref=f7e414]:
                - paragraph [ref=f7e415]: A healthcare company uses Amazon Bedrock to deploy an application that produces summaries of clinical documents. The application has inconsistent response quality, including occasional factual hallucinations. Monthly costs are 40% higher than the company projected. A GenAI developer must implement a near-real-time monitoring solution that detects hallucinations, identifies abnormal token consumption, and provides early warnings for cost anomalies. The solution must involve minimal custom development and maintenance overhead.
                - paragraph [ref=f7e416]: Which solution meets these requirements?
                - generic [ref=f7e417]:
                  - list [ref=f7e418]:
                    - listitem [ref=f7e419] [cursor=pointer]:
                      - strong [ref=f7e420]: A
                      - text: Configure Amazon CloudWatch alarms to monitor InputTokenCount and OutputTokenCount metrics to detect anomalies. Store model invocation logs in an Amazon S3 bucket. Use AWS Glue and Amazon Athena to identify potential hallucinations.
                    - listitem [ref=f7e421] [cursor=pointer]:
                      - strong [ref=f7e422]: B
                      - text: Run Amazon Bedrock evaluation jobs that use LLM-based judgments to detect hallucinations. Configure Amazon CloudWatch to track token usage. Create an AWS Lambda function to process CloudWatch metrics. Configure the Lambda function to send usage pattern notifications.
                    - listitem [ref=f7e423] [cursor=pointer]:
                      - strong [ref=f7e424]: C
                      - text: Configure Amazon Bedrock to store model invocation logs in an Amazon S3 bucket. Enable text output logging. Configure Amazon Bedrock guardrails to run contextual grounding checks to detect hallucinations. Create Amazon CloudWatch anomaly detection alarms for token usage metrics.
                    - listitem [ref=f7e425] [cursor=pointer]:
                      - strong [ref=f7e426]: D
                      - text: Use AWS CloudTrail to log all Amazon Bedrock API calls. Create a custom dashboard in Amazon QuickSight to visualize token usage patterns. Use Amazon SageMaker Model Monitor to detect quality drift in generated summaries.
                  - button "Show Answer" [ref=f7e427] [cursor=pointer]
                  - generic [ref=f7e434]:
                    - group "Explanation" [ref=f7e435]:
                      - paragraph [ref=f7e437]:
                        - text: Amazon Bedrock Guardrails contextual grounding checks detect and filter hallucinations by assessing whether generated content is factually grounded in a supplied reference source, including for summarization. Amazon Bedrock provides
                        - code [ref=f7e438]: InputTokenCount
                        - text: and
                        - code [ref=f7e439]: OutputTokenCount
                        - text: CloudWatch metrics, and CloudWatch anomaly-detection alarms identify departures from expected metric patterns, enabling early warning of unusual token-driven costs. Bedrock model invocation logging can retain text input and output data in Amazon S3.
                    - group "Learn more" [ref=f7e440]:
                      - list [ref=f7e442]:
                        - listitem [ref=f7e443]:
                          - link "Use contextual grounding check to filter hallucinations in responses" [ref=f7e444] [cursor=pointer]:
