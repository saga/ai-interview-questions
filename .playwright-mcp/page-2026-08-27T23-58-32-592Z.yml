            - generic [ref=f7e243]:
              - generic [ref=f7e244]:
                - paragraph [ref=f7e245]: A company is designing a solution that uses foundation models (FMs) to support multiple AI workloads. Some FMs must be invoked on demand in real time. Other FMs need consistent, high-throughput access for batch processing.
                - paragraph [ref=f7e246]: The solution must support hybrid deployment patterns and run workloads across cloud and on-premises infrastructure to meet data residency and compliance requirements.
                - paragraph [ref=f7e247]: Which combination of steps meets these requirements?
                - generic [ref=f7e248]:
                  - generic [ref=f7e249]: Choose two
                  - list [ref=f7e250]:
                    - listitem [ref=f7e251] [cursor=pointer]:
                      - strong [ref=f7e252]: A
                      - text: Use AWS Lambda to orchestrate low-latency FM inference by invoking FMs hosted on Amazon SageMaker AI asynchronous endpoints.
                    - listitem [ref=f7e253] [cursor=pointer]:
                      - strong [ref=f7e254]: B
                      - text: Configure provisioned throughput in Amazon Bedrock to ensure consistent performance for high-volume workloads.
                    - listitem [ref=f7e255] [cursor=pointer]:
                      - strong [ref=f7e256]: C
                      - text: Deploy FMs to Amazon SageMaker AI endpoints with support for edge deployment by using Amazon SageMaker Neo. Orchestrate the FMs by using AWS Lambda to support hybrid deployment.
                    - listitem [ref=f7e257] [cursor=pointer]:
                      - strong [ref=f7e258]: D
                      - text: Use Amazon Bedrock with auto-scaling to handle unpredictable traffic surges.
                    - listitem [ref=f7e259] [cursor=pointer]:
                      - strong [ref=f7e260]: E
                      - text: Use Amazon SageMaker JumpStart to host and invoke the FMs.
                  - button "Show Answer" [ref=f7e261] [cursor=pointer]
                  - generic [ref=f7e268]:
                    - group "Explanation" [ref=f7e269]:
                      - paragraph [ref=f7e271]: Amazon Bedrock Provisioned Throughput supplies dedicated model capacity for consistent, high-volume workloads. Amazon SageMaker AI endpoints support real-time inference, while SageMaker Neo can optimize and deploy supported models for both cloud instances and edge devices, enabling a hybrid cloud/on-premises pattern.
                    - group "Learn more" [ref=f7e272]:
                      - list [ref=f7e274]:
                        - listitem [ref=f7e275]:
