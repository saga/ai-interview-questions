# Cloudflare Workers + Assets 部署配置
# 本应用是 SPA（构建产物 dist/，HashRouter）。Cloudflare 既托管静态资源（[assets]），
# 也通过 main = "./worker/index.ts" 提供一份极薄的同源代理：把 /api/ai/* 转发到
# api.cloudflare.com，从而解决 Cloudflare Workers AI 浏览器直连的 CORS 问题。
# 本地开发由 vite.config.ts 的 server.proxy 直接转发到同一固定上游，不启动额外 Node 服务。
# Copilot SDK 的本地 API 由 vite-plugin-copilot-sdk.ts 提供，仅在 Vite 开发模式运行。
# 发布范围：仅 dist/ —— 本地 Python 分析工程（analysis/，含 *.py、pyproject.toml、uv.lock）与经
#   Git LFS 管理的离线模型 analysis/models/ 不参与浏览器构建，不会被发布。
# 全部 Python 工程已收进 analysis/ 子目录，仓库根不再有 pyproject.toml / uv.lock / requirements.txt，
#   避免 Cloudflare 把本仓库识别成 Python 项目而在构建期安装 Python。
# 部署命令：npx wrangler deploy（Workers + Assets 模式，仅读取 [assets] directory = "./dist"）。

name = "ai-interview-trainer"
compatibility_date = "2025-08-30"

# Worker 入口：负责把 /api/ai/* 同源代理到 api.cloudflare.com（浏览器直连该域名无 CORS 头）。
# 非 /api/ai 请求交给 [assets] 提供静态 SPA；Copilot SDK 开发 API 不包含在此 Worker 中。
main = "./worker/index.ts"

[observability]
enabled = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"