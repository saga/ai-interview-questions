# Cloudflare Workers + Assets 部署配置
# 本应用是纯静态 SPA，构建产物在 dist/，使用 HashRouter（无需 Worker 脚本 / SPA fallback）。
# 发布范围：仅 dist/ —— Python 分析脚本（analysis/ 工程 + scripts/*.py）与经 Git LFS 管理的离线模型 models/ 不参与浏览器构建，不会被发布。
# 仓库根的 Python 工程清单（pyproject.toml / uv.lock）已移至 analysis/，避免 Cloudflare 把本仓库识别成 Python 项目而在构建期安装 Python。
# 部署命令：npx wrangler deploy（Workers + Assets 模式，读取 [assets] directory = "./dist"）。

name = "ai-interview-trainer"
compatibility_date = "2025-08-30"

[observability]
enabled = false

[assets]
directory = "./dist"