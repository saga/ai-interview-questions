name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Validate questions
        run: npm run validate:questions
      - name: Lint option-length bias
        run: npm run lint:bias
      - name: Lint option-length ratio (gate on changed files only)
        run: npm run lint:length -- --changed
      - name: Audit question bank
        run: npm run question:audit
      - name: Question identity gate (incremental, PR/base only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run question:identity -- --gate --since ${{ github.event.pull_request.base.sha }}
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            npm run question:identity -- --gate --since ${{ github.event.before }}
          else
            npm run question:identity -- --gate --since HEAD~1
          fi
      - name: Validate variants (release gate)
        run: npm run question:validate-variants

  deploy:
    needs: verify
    # 仅在推送到 main 且配置了 Cloudflare 密钥时部署，避免 PR / 无密钥时失败。
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages (dist/ only)
        run: npm run cloudflare:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
