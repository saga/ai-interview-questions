name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Full verification
        run: npm run check
      - name: Question identity gate (incremental)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-question-identity.ts --gate --since ${{ github.event.pull_request.base.sha }}
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-question-identity.ts --gate --since ${{ github.event.before }}
          else
            node scripts/check-question-identity.ts --gate --since HEAD~1
          fi
      - name: Learning content quality gate (changed tutorials)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/audit-learning-content.mjs --strict --base ${{ github.event.pull_request.base.sha }}
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/audit-learning-content.mjs --strict --base ${{ github.event.before }}
          else
            node scripts/audit-learning-content.mjs --strict --base HEAD~1
          fi
      - name: Validate variants
        run: npx vite-node scripts/validate-variants.ts

  deploy:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run deploy -- pages
